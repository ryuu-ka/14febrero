<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14 de febrero</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
        }
        .subtitle {
            font-size: 1rem;
            color: #aaa;
        }
        canvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <h1>Heart Shape Animation<br><span class="subtitle">DevFlash</span></h1>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Configuración inicial del canvas
        canvas.width = window.innerWidth * 0.9;
        canvas.height = window.innerHeight * 0.7;
        canvas.style.maxWidth = '90%';
        canvas.style.maxHeight = '70%';

        // Configuración de la animación
        const settings = {
            numParticles: 300, // Más partículas = más líneas
            lineOpacity: 0.7
        };

        let pulseTime = 0;
        let particles = [];

        // Genera los puntos del corazón
        function generateHeartShape(width, height, pulseTime) {
            const heartPoints = [];
            const centerX = width / 2;
            const centerY = height / 2;

            const pulse = 1 + Math.sin(pulseTime) * 0.05;
            const scale = 15 * pulse;
            const steps = settings.numParticles;

            for (let i = 0; i < steps; i++) {
                const t = (i / steps) * Math.PI * 2;
                const x = centerX + scale * 16 * Math.pow(Math.sin(t), 3);
                const y = centerY - scale * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                heartPoints.push({ x, y });
            }
            return heartPoints;
        }

        // Inicializa las partículas
        function initParticles() {
            particles = [];
            const heartPoints = generateHeartShape(canvas.width, canvas.height, pulseTime);
            
            // Crea partículas con posiciones aleatorias DENTRO del corazón
            for (let i = 0; i < settings.numParticles; i++) {
                const point = heartPoints[Math.floor(Math.random() * heartPoints.length)];
                particles.push({
                    x: point.x,
                    y: point.y,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: (Math.random() - 0.5) * 2,
                    hue: Math.random() * 360
                });
            }
        }

        // Actualiza la posición de las partículas
        function updateParticles() {
            const heartPoints = generateHeartShape(canvas.width, canvas.height, pulseTime);
            
            particles.forEach(p => {
                // Mover partículas con velocidad aleatoria
                p.x += p.speedX;
                p.y += p.speedY;
                
                // Rebotar en los bordes del corazón
                const nearestPoint = findNearestHeartPoint(p.x, p.y, heartPoints);
                const distance = Math.sqrt(
                    Math.pow(p.x - nearestPoint.x, 2) + 
                    Math.pow(p.y - nearestPoint.y, 2)
                );
                
                if (distance > 20) { // Si se sale del corazón
                    p.speedX *= -0.5;
                    p.speedY *= -0.5;
                }
                
                // Cambiar color gradualmente
                p.hue = (p.hue + 0.5) % 360;
            });
        }

        // Encuentra el punto del corazón más cercano
        function findNearestHeartPoint(x, y, heartPoints) {
            let nearest = heartPoints[0];
            let minDist = Infinity;
            
            for (const point of heartPoints) {
                const dist = Math.sqrt(
                    Math.pow(x - point.x, 2) + 
                    Math.pow(y - point.y, 2)
                );
                if (dist < minDist) {
                    minDist = dist;
                    nearest = point;
                }
            }
            return nearest;
        }

        // Dibuja las líneas entre partículas
        function drawHeart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar líneas entre partículas cercanas
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // Solo conectar partículas cercanas
                    if (distance < 120) {
                        const hue = (particles[i].hue + particles[j].hue) / 2;
                        ctx.strokeStyle = `hsl(${hue}, 100%, 70%, ${settings.lineOpacity})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            // Dibujar el contorno del corazón (opcional)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const heartPoints = generateHeartShape(canvas.width, canvas.height, pulseTime);
            ctx.moveTo(heartPoints[0].x, heartPoints[0].y);
            for (let i = 1; i < heartPoints.length; i++) {
                ctx.lineTo(heartPoints[i].x, heartPoints[i].y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // Bucle de animación
        function animate() {
            pulseTime += 0.01;
            updateParticles();
            drawHeart();
            requestAnimationFrame(animate);
        }

        // Ajustar tamaño al redimensionar
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * 0.9;
            canvas.height = window.innerHeight * 0.7;
            initParticles();
        });

        // Iniciar animación
        initParticles();
        animate();
    </script>
</body>
</html>
