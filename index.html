<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Shape Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
        }
        .subtitle {
            font-size: 1rem;
            color: #aaa;
        }
        canvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <h1>Heart Shape Animation<br><span class="subtitle">DevFlash</span></h1>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Configuración inicial del canvas
        canvas.width = window.innerWidth * 0.9;
        canvas.height = window.innerHeight * 0.7;
        canvas.style.maxWidth = '90%';
        canvas.style.maxHeight = '70%';

        // Configuración de la animación
        const settings = {
            numParticles: 200
        };

        let pulseTime = 0;

        // Genera los puntos del corazón
        function generateHeartShape(width, height, pulseTime, settings) {
            const heartPoints = [];
            const centerX = width / 2;
            const centerY = height / 2;

            const pulse = 1 + Math.sin(pulseTime) * 0.05;
            const scale = 15 * pulse;
            const steps = Math.max(40, settings.numParticles);

            for (let i = 0; i < steps; i++) {
                const t = (i / steps) * Math.PI * 2;
                const x = centerX + scale * 16 * Math.pow(Math.sin(t), 3);
                const y = centerY - scale * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                heartPoints.push({ x, y });
            }
            return heartPoints;
        }

        // Dibuja el corazón en el canvas
        function drawHeart(points) {
            if (points.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }

            // Color dinámico (arcoíris)
            const hue = (pulseTime * 50) % 360;
            ctx.strokeStyle = `hsl(${hue}, 100%, 70%)`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // Bucle de animación
        function animate() {
            pulseTime += 0.01;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const heartPoints = generateHeartShape(
                canvas.width, 
                canvas.height, 
                pulseTime, 
                settings
            );
            
            drawHeart(heartPoints);
            requestAnimationFrame(animate);
        }

        // Ajustar tamaño al redimensionar
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * 0.9;
            canvas.height = window.innerHeight * 0.7;
        });

        // Iniciar animación
        animate();
    </script>
</body>
</html>
